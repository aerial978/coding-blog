---
engines:
  phpmd:
    enabled: true
    config: phpmd.xml

  phpstan:
    enabled: true
    config: .phpstan.neon.dist

  phpcs:
    enabled: true
    config: phpcs.xml

  php-cs-fixer:
    enabled: true
    config: .php-cs-fixer.dist.php

  eslint:
    enabled: true
    config: .eslint.config.mjs

  stylelint:
    enabled: true
    config: .stylelintrc.json

  markdownlint:
    enabled: true

# Exclure des chemins côté Codacy (y compris les tests)
exclude_paths:
  - vendor/**
  - node_modules/**
  - tmp/**
  - cache/**
  - .github/**
  - tests/
  - Tests/
  - tests/**
  - Tests/**
  - composer.lock
  - package-lock.json
